<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#glow)" />

  <!-- Inner Subtle Border -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Monogram EP Text -->
  <g fill="#ffffff">
    <!-- Letter E -->
    <path d="M 148 140 L 244 140 C 250 140 254 144 254 150 L 254 172 C 254 178 250 182 244 182 L 186 182 L 186 226 L 236 226 C 242 226 246 230 246 236 L 246 258 C 246 264 242 268 236 268 L 186 268 L 186 312 L 246 312 C 252 312 256 316 256 322 L 256 344 C 256 350 252 354 246 354 L 148 354 C 142 354 138 350 138 344 L 138 150 C 138 144 142 140 148 140 Z" />
    
    <!-- Letter P -->
    <path d="M 276 140 L 338 140 C 374 140 400 162 400 198 C 400 234 374 256 338 256 L 314 256 L 314 344 C 314 350 310 354 304 354 L 286 354 C 280 354 276 350 276 344 L 276 140 Z M 314 182 L 314 214 L 334 214 C 348 214 360 206 360 198 C 360 190 348 182 334 182 L 314 182 Z" />
  </g>

  <!-- Glowing Heartbeat Pulse Wave -->
  <polyline
    points="96,396 180,396 210,356 244,436 274,380 296,408 316,396 416,396"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Accent Pulse Dot -->
  <circle cx="244" cy="436" r="8" fill="#ffffff" />
</svg>
